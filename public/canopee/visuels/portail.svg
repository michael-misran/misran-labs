<defs><marker id="m-conforme" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-conforme" d="M0,1 L9,5 L0,9 z"/></marker><marker id="m-moyen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-moyen" d="M0,1 L9,5 L0,9 z"/></marker><marker id="m-neutre" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-neutre" d="M0,1 L9,5 L0,9 z"/></marker></defs>
<rect class="fond" width="720" height="584" rx="10"/>
<text class="texte titre" x="24" y="34">Le circuit de relecture du portail</text>
<text class="secondaire" x="24" y="55">Le vérificateur signale, l&#x27;humain tranche ; celui qui soumet n&#x27;est jamais celui qui valide</text>
<rect class="t-neutre s-neutre" x="24.0" y="110.0" width="132.0" height="40.0" rx="20" stroke-width="1.5"/>
<text class="texte gras" x="90.0" y="135.0" text-anchor="middle" style="font-size:13.5px">Brouillon</text>
<rect class="t-controle s-controle" x="204.0" y="110.0" width="132.0" height="40.0" rx="20" stroke-width="1.5"/>
<text class="texte gras" x="270.0" y="135.0" text-anchor="middle" style="font-size:13.5px">En relecture</text>
<rect class="t-moyen s-moyen" x="384.0" y="110.0" width="132.0" height="40.0" rx="20" stroke-width="1.5"/>
<text class="texte gras" x="450.0" y="135.0" text-anchor="middle" style="font-size:13.5px">À corriger</text>
<rect class="t-conforme s-conforme" x="564.0" y="110.0" width="132.0" height="40.0" rx="20" stroke-width="1.5"/>
<text class="texte gras" x="630.0" y="135.0" text-anchor="middle" style="font-size:13.5px">Validé</text>
<path class="s-neutre" d="M156.0,130.0 L202.0,130.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<text class="secondaire s-fond" x="179.0" y="121.0" text-anchor="middle" style="font-size:10.5px" stroke-width="4" paint-order="stroke" stroke-linejoin="round">soumettre</text>
<path class="s-conforme" d="M270.0,108.0 L270.0,88.0 L630.0,88.0 L630.0,108.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-conforme)"/>
<text class="secondaire s-fond" x="450.0" y="92.0" text-anchor="middle" style="font-size:10.5px" stroke-width="4" paint-order="stroke" stroke-linejoin="round">valider : aucun signalement juste, et un autre compte</text>
<path class="s-moyen" d="M336.0,130.0 L382.0,130.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-moyen)"/>
<text class="secondaire s-fond" x="359.0" y="121.0" text-anchor="middle" style="font-size:10.5px" stroke-width="4" paint-order="stroke" stroke-linejoin="round">renvoyer</text>
<path class="s-neutre" d="M450.0,152.0 L450.0,172.0 L270.0,172.0 L270.0,152.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<text class="secondaire s-fond" x="360.0" y="188.0" text-anchor="middle" style="font-size:10.5px" stroke-width="4" paint-order="stroke" stroke-linejoin="round">le rédacteur révise, une seule fois</text>
<text class="texte gras" x="24.0" y="222.0" text-anchor="start" style="font-size:13.5px">Qui signe chaque étape</text>
<rect class="t-controle s-controle" x="24.0" y="240.0" width="200.0" height="42.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="36.0" y="257.2" text-anchor="start" style="font-size:13px">Rédacteur et vérificateur</text>
<text class="secondaire" x="36.0" y="274.2" text-anchor="start" style="font-size:11.5px">agents locaux</text>
<text class="secondaire" x="240.0" y="258.0" text-anchor="start">rédigent, puis signalent les phrases sans source ou contredites,</text>
<text class="secondaire" x="240.0" y="274.9" text-anchor="start">avec leur motif</text>
<rect class="t-local s-local" x="24.0" y="290.0" width="200.0" height="42.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="36.0" y="307.2" text-anchor="start" style="font-size:13px">Compte A, pôle programme</text>
<text class="secondaire" x="36.0" y="324.2" text-anchor="start" style="font-size:11.5px">directeur</text>
<text class="secondaire" x="240.0" y="308.0" text-anchor="start">tranche chaque signalement (juste ou fausse alerte), commente,</text>
<text class="secondaire" x="240.0" y="324.9" text-anchor="start">soumet</text>
<rect class="t-local s-local" x="24.0" y="340.0" width="200.0" height="42.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="36.0" y="357.2" text-anchor="start" style="font-size:13px">Compte B, pôle programme</text>
<text class="secondaire" x="36.0" y="374.2" text-anchor="start" style="font-size:11.5px">second regard</text>
<text class="secondaire" x="240.0" y="358.0" text-anchor="start">valide le dossier soumis par A ; A ne le peut pas</text>
<rect class="t-neutre s-neutre" x="24.0" y="390.0" width="200.0" height="42.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="36.0" y="407.2" text-anchor="start" style="font-size:13px">DPO, RSSI, bureau</text>
<text class="secondaire" x="36.0" y="424.2" text-anchor="start" style="font-size:11.5px">autres rôles</text>
<text class="secondaire" x="240.0" y="408.0" text-anchor="start">ne valident jamais une rédaction : refus journalisé</text>
<text class="texte gras" x="24.0" y="462.0" text-anchor="start" style="font-size:13.5px">Le journal chaîné</text>
<text class="secondaire petit" x="160.0" y="462.0" text-anchor="start">chaque ligne porte l&#x27;empreinte de la précédente : effacer une ligne casse la chaîne</text>
<rect class="t-neutre s-neutre" x="24.0" y="476.0" width="196.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="36.0" y="497.2" text-anchor="start" style="font-size:13px">#41 · soumission</text>
<text class="secondaire" x="36.0" y="514.2" text-anchor="start" style="font-size:11.5px">compte A, accepté</text>
<rect class="t-moyen s-moyen" x="252.0" y="476.0" width="196.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="264.0" y="497.2" text-anchor="start" style="font-size:13px">#42 · validation</text>
<text class="secondaire" x="264.0" y="514.2" text-anchor="start" style="font-size:11.5px">compte A, refusé</text>
<path class="s-neutre" d="M222.0,501.0 L250.0,501.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-neutre s-neutre" x="480.0" y="476.0" width="196.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="492.0" y="497.2" text-anchor="start" style="font-size:13px">#43 · validation</text>
<text class="secondaire" x="492.0" y="514.2" text-anchor="start" style="font-size:11.5px">compte B, accepté</text>
<path class="s-neutre" d="M450.0,501.0 L478.0,501.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<text class="discret petit" x="24.0" y="546.0" text-anchor="start">Exemple. Le refus est journalisé lui aussi, avec son motif : « séparation des tâches ».</text>
<text class="discret petit" x="24" y="570">Source : docs/etapes/08-portail.md · généré par outils/schemas.py</text>
