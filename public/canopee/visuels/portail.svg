<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" width="720" height="584" role="img" aria-labelledby="titre desc">
<title id="titre">Le circuit de relecture du portail</title>
<desc id="desc">Une rédaction passe de brouillon à en relecture, puis à validé, ou revient à corriger si un signalement est jugé juste. Le compte qui a soumis un dossier ne peut pas le valider : un second compte du pôle programme le fait. Chaque action est signée et inscrite dans un journal chaîné.</desc>
