<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 546" width="720" height="546" role="img" aria-labelledby="titre desc">
<title id="titre">Le chemin d&#x27;une question</title>
<desc id="desc">Une question est cherchée de deux façons, par les mots (BM25) et par le sens (vecteurs bge-m3), 30 candidats chacune ; les deux listes sont fusionnées par rangs réciproques ; les 15 meilleurs sont notés par Gemma 4 ; au plus 5 passages notés 5 ou plus vont au rédacteur, dont chaque phrase cite sa source, puis un contrôle vérifie les citations. Sans passage noté 5, le système s&#x27;abstient sans appeler le rédacteur.</desc>
