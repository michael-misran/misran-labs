<defs></defs>
<rect class="fond" width="720" height="498" rx="10"/>
<text class="texte titre" x="24" y="34">La défense en profondeur</text>
<text class="secondaire" x="24" y="55">Cinq barrières de nature différente autour des données privées : une fuite demande plusieurs erreurs</text>
<rect class="t-neutre s-neutre" x="24.0" y="82.0" width="672.0" height="376.0" rx="12" stroke-width="1.25"/>
<text class="texte gras" x="38.0" y="103.0" text-anchor="start">1 · .gitignore</text>
<text class="secondaire petit" x="682.0" y="103.0" text-anchor="end">étape 1 · exclusion</text>
<text class="secondaire petit" x="38.0" y="121.0" text-anchor="start">empêche : que les données partent sur GitHub avec le code</text>
<text class="discret petit" x="682.0" y="121.0" text-anchor="end">limite : un fichier déjà suivi, un ajout forcé</text>
<rect class="t-neutre s-neutre" x="36.0" y="134.0" width="648.0" height="312.0" rx="12" stroke-width="1.25"/>
<text class="texte gras" x="50.0" y="155.0" text-anchor="start">2 · Règles deny de Claude Code</text>
<text class="secondaire petit" x="670.0" y="155.0" text-anchor="end">étape 1 · permission</text>
<text class="secondaire petit" x="50.0" y="173.0" text-anchor="start">empêche : que l&#x27;outil de lecture ouvre un fichier privé</text>
<text class="discret petit" x="670.0" y="173.0" text-anchor="end">limite : une commande du terminal, comme cat</text>
<rect class="t-controle s-controle" x="48.0" y="186.0" width="624.0" height="248.0" rx="12" stroke-width="1.25"/>
<text class="texte gras" x="62.0" y="207.0" text-anchor="start">3 · CLAUDE.md, règle n°1</text>
<text class="secondaire petit" x="658.0" y="207.0" text-anchor="end">étape 1 · consigne</text>
<text class="secondaire petit" x="62.0" y="225.0" text-anchor="start">empêche : les contournements par le terminal ou un script</text>
<text class="discret petit" x="658.0" y="225.0" text-anchor="end">limite : une consigne n&#x27;est pas un verrou</text>
<rect class="t-controle s-controle" x="60.0" y="238.0" width="600.0" height="184.0" rx="12" stroke-width="1.25"/>
<text class="texte gras" x="74.0" y="259.0" text-anchor="start">4 · Crochet sur le terminal</text>
<text class="secondaire petit" x="646.0" y="259.0" text-anchor="end">étape 10 · contrôle</text>
<text class="secondaire petit" x="74.0" y="277.0" text-anchor="start">empêche : les commandes du terminal sur la zone privée</text>
<text class="discret petit" x="646.0" y="277.0" text-anchor="end">limite : seulement les outils de Claude Code</text>
<rect class="t-local s-local" x="72.0" y="290.0" width="576.0" height="120.0" rx="12" stroke-width="1.25"/>
<text class="texte gras" x="86.0" y="311.0" text-anchor="start">5 · Chiffrement des bases</text>
<text class="secondaire petit" x="634.0" y="311.0" text-anchor="end">étape 5 · verrou</text>
<text class="secondaire petit" x="86.0" y="329.0" text-anchor="start">empêche : toute lecture du fichier sans la clé</text>
<text class="discret petit" x="634.0" y="329.0" text-anchor="end">limite : la clé doit elle-même être gardée</text>
<text class="texte gras" x="360.0" y="376.0" text-anchor="middle" style="font-size:14px">Les données privées</text>
<text class="secondaire petit" x="360.0" y="394.0" text-anchor="middle">le dossier privé et les bases chiffrées</text>
<text class="discret petit" x="24" y="484">Source : docs/livre/01-socle.md, docs/etapes/05-corpus-prive.md et 10-red-team.md · généré par outils/schemas.py</text>
</svg>
