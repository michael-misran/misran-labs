<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 498" width="720" height="498" role="img" aria-labelledby="titre desc">
<title id="titre">La défense en profondeur</title>
<desc id="desc">Cinq barrières emboîtées autour des données privées : l&#x27;exclusion de Git, les règles deny de Claude Code, la consigne du CLAUDE.md, le crochet qui refuse le terminal sur la zone privée (étape 10) et le chiffrement des bases (étape 5). Chacune a sa limite, couverte par une autre.</desc>
