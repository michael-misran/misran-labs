<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 718" width="720" height="718" role="img" aria-labelledby="titre desc">
<title id="titre">La passerelle d&#x27;anonymisation</title>
<desc id="desc">Le pipeline de canopee-passerelle en quatre temps : détecter en trois couches (expressions régulières, reconnaissance des noms, dictionnaire), transformer (code cohérent, masquage, généralisation, quasi-identifiants), contrôler (garde de sortie, gardien), puis sortir vers Claude et ré-identifier la réponse sur le Mac selon le rôle. Le fichier des adhérents suit un autre chemin : extraction k-anonyme et statistiques bruitées.</desc>
