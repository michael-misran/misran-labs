<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" width="720" height="590" role="img" aria-labelledby="titre desc">
<title id="titre">Le circuit Git du projet</title>
<desc id="desc">Sept temps, en trois colonnes : Claude Code crée la branche, Michael donne son accord, Claude Code commite, l&#x27;agent contrôleur pose son tampon, Michael pousse la branche, Claude Code ouvre la pull request, Michael fusionne sur GitHub. Jamais de push direct sur main.</desc>
