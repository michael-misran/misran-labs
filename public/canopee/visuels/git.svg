<text class="secondaire" x="360.0" y="219.5" text-anchor="middle" style="font-size:11.5px">pour ce commit-là : un</text>
<text class="secondaire" x="360.0" y="235.0" text-anchor="middle" style="font-size:11.5px">accord ne vaut qu&#x27;une fois</text>
<circle class="f-local" cx="268.0" cy="188.0" r="9"/>
<text class="f-fond gras" x="268.0" y="192.0" text-anchor="middle" style="font-size:11px">2</text>
<path class="s-neutre" d="M216.0,152.0 L242.0,152.0 L242.0,214.0 L266.0,214.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-cloud s-cloud" x="32.0" y="250.0" width="184.0" height="52.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="124.0" y="264.5" text-anchor="middle" style="font-size:13px">Commit</text>
<text class="secondaire" x="124.0" y="281.5" text-anchor="middle" style="font-size:11.5px">le code et la doc, jamais</text>
<text class="secondaire" x="124.0" y="297.0" text-anchor="middle" style="font-size:11.5px">de données</text>
<circle class="f-cloud" cx="32.0" cy="250.0" r="9"/>
<text class="f-fond gras" x="32.0" y="254.0" text-anchor="middle" style="font-size:11px">3</text>
<path class="s-neutre" d="M268.0,214.0 L242.0,214.0 L242.0,276.0 L214.0,276.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-cloud s-cloud" x="32.0" y="312.0" width="184.0" height="52.0" rx="8" stroke-width="1.25"/>
