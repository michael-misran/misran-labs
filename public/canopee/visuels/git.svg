<text class="secondaire" x="124.0" y="343.5" text-anchor="middle" style="font-size:11.5px">build, secrets, données</text>
<text class="secondaire" x="124.0" y="359.0" text-anchor="middle" style="font-size:11.5px">personnelles : un tampon</text>
