<text class="secondaire" x="360.0" y="405.5" text-anchor="middle" style="font-size:11.5px">Michael pousse lui-même,</text>
<text class="secondaire" x="360.0" y="421.0" text-anchor="middle" style="font-size:11.5px">jamais main</text>
<circle class="f-local" cx="268.0" cy="374.0" r="9"/>
