<text class="texte titre" x="24" y="34">Le circuit Git du projet</text>
<text class="secondaire" x="24" y="55">La machine propose et exécute ; l&#x27;humain décide de ce qui engage</text>
<rect class="f-cloud" x="24.0" y="80.0" width="200.0" height="30.0" rx="6"/>
