<line class="trait" x1="596.0" y1="112.0" x2="596.0" y2="560.0" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect class="t-cloud s-cloud" x="32.0" y="126.0" width="184.0" height="52.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="124.0" y="140.5" text-anchor="middle" style="font-size:13px">Branche</text>
<text class="secondaire" x="124.0" y="157.5" text-anchor="middle" style="font-size:11.5px">etape-NN-nom, partie de</text>
<text class="secondaire" x="124.0" y="173.0" text-anchor="middle" style="font-size:11.5px">main à jour</text>
<circle class="f-cloud" cx="32.0" cy="126.0" r="9"/>
