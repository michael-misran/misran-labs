<text class="secondaire" x="596.0" y="467.5" text-anchor="middle" style="font-size:11.5px">refusée sans le tampon du</text>
<text class="secondaire" x="596.0" y="483.0" text-anchor="middle" style="font-size:11.5px">contrôleur</text>
