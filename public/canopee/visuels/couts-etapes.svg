<title id="titre">Ce que chaque étape a coûté</title>
<desc id="desc">Pour chaque étape, à gauche l&#x27;usage effectif de Claude (millions d&#x27;unités), à droite le temps de calcul des modèles locaux (heures). Le coût de Claude suit la longueur des sessions ; le calcul local se concentre sur l&#x27;évaluation (étape 3) et le corpus privé (étape 5).</desc>
