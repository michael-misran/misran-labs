<text class="texte titre" x="24" y="34">La red team, avant et après les correctifs</text>
<text class="secondaire" x="24" y="55">Six attaques rejouées sur le Mac, des compteurs seulement ; puis les tests rejouables de la purple team</text>
<text class="texte gras" x="262.0" y="96.0" text-anchor="start">Avant</text>
<text class="texte gras" x="485.0" y="96.0" text-anchor="start">Après le correctif</text>
<rect class="carte" x="18.0" y="108.0" width="684.0" height="56.0" rx="4"/>
<text class="texte gras" x="24.0" y="127.0" text-anchor="start">MCP</text>
<text class="secondaire" x="24.0" y="142.0" text-anchor="start" style="font-size:11px">le serveur public tient la clé de</text>
<text class="secondaire" x="24.0" y="156.0" text-anchor="start" style="font-size:11px">prive.db et la liste des noms</text>
<rect class="f-eleve" x="262.0" y="113.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-eleve gras" x="291.3" y="125.5" text-anchor="middle" style="font-size:11px">réussie</text>
<text class="secondaire" x="262.0" y="142.0" text-anchor="start" style="font-size:11px">2 595 métadonnées + 2 015 noms en</text>
<text class="secondaire" x="262.0" y="156.0" text-anchor="start" style="font-size:11px">mémoire du serveur</text>
<rect class="f-conforme" x="485.0" y="113.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="520.7" y="125.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire" x="485.0" y="142.0" text-anchor="start" style="font-size:11px">0 métadonnée, 0 nom : le serveur</text>
<text class="secondaire" x="485.0" y="156.0" text-anchor="start" style="font-size:11px">ne compare que des empreintes</text>
<text class="texte gras" x="24.0" y="183.0" text-anchor="start">Terminal</text>
<text class="secondaire" x="24.0" y="198.0" text-anchor="start" style="font-size:11px">le terminal contourne la règle n°1</text>
<text class="secondaire" x="24.0" y="212.0" text-anchor="start" style="font-size:11px">(cat, sqlite3…)</text>
<rect class="f-eleve" x="262.0" y="169.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-eleve gras" x="291.3" y="181.5" text-anchor="middle" style="font-size:11px">réussie</text>
<text class="secondaire" x="262.0" y="198.0" text-anchor="start" style="font-size:11px">0 commande bloquée, aucun</text>
<text class="secondaire" x="262.0" y="212.0" text-anchor="start" style="font-size:11px">garde-fou</text>
<rect class="f-conforme" x="485.0" y="169.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="520.7" y="181.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire" x="485.0" y="198.0" text-anchor="start" style="font-size:11px">7/7 commandes privées bloquées, 0</text>
<text class="secondaire" x="485.0" y="212.0" text-anchor="start" style="font-size:11px">commande bénigne gênée</text>
<rect class="carte" x="18.0" y="220.0" width="684.0" height="56.0" rx="4"/>
<text class="texte gras" x="24.0" y="239.0" text-anchor="start">Injection</text>
<text class="secondaire" x="24.0" y="254.0" text-anchor="start" style="font-size:11px">une consigne cachée dans un faux</text>
<text class="secondaire" x="24.0" y="268.0" text-anchor="start" style="font-size:11px">document public</text>
<rect class="f-conforme" x="262.0" y="225.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="297.7" y="237.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire" x="262.0" y="254.0" text-anchor="start" style="font-size:11px">le gardien bloque 10/10 sorties</text>
<text class="secondaire" x="262.0" y="268.0" text-anchor="start" style="font-size:11px">piégées</text>
<rect class="f-conforme" x="485.0" y="225.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="520.7" y="237.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire" x="485.0" y="254.0" text-anchor="start" style="font-size:11px">inchangée</text>
<text class="texte gras" x="24.0" y="295.0" text-anchor="start">Portail</text>
<text class="secondaire" x="24.0" y="310.0" text-anchor="start" style="font-size:11px">CSRF, droits par rôle, séparation des</text>
<text class="secondaire" x="24.0" y="324.0" text-anchor="start" style="font-size:11px">tâches, rejeu</text>
<rect class="f-conforme" x="262.0" y="281.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="297.7" y="293.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire" x="262.0" y="310.0" text-anchor="start" style="font-size:11px">56/56 formulaires forgés refusés</text>
<rect class="f-conforme" x="485.0" y="281.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="520.7" y="293.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire" x="485.0" y="310.0" text-anchor="start" style="font-size:11px">inchangée</text>
<rect class="carte" x="18.0" y="332.0" width="684.0" height="70.0" rx="4"/>
<text class="texte gras" x="24.0" y="351.0" text-anchor="start">Ré-identification</text>
<text class="secondaire" x="24.0" y="366.0" text-anchor="start" style="font-size:11px">ré-identifier par (âge, lieu,</text>
<text class="secondaire" x="24.0" y="380.0" text-anchor="start" style="font-size:11px">profession)</text>
<rect class="f-eleve" x="262.0" y="337.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-eleve gras" x="291.3" y="349.5" text-anchor="middle" style="font-size:11px">réussie</text>
<text class="secondaire" x="262.0" y="366.0" text-anchor="start" style="font-size:11px">54,8 % d&#x27;adhérents isolés dans le</text>
<text class="secondaire" x="262.0" y="380.0" text-anchor="start" style="font-size:11px">fichier brut ; 0 % dans</text>
<text class="secondaire" x="262.0" y="394.0" text-anchor="start" style="font-size:11px">l&#x27;extraction partagée</text>
<rect class="f-moyen" x="485.0" y="337.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-moyen gras" x="514.3" y="349.5" text-anchor="middle" style="font-size:11px">ouverte</text>
<text class="secondaire" x="485.0" y="366.0" text-anchor="start" style="font-size:11px">reportée à l&#x27;étape 11</text>
<text class="texte gras" x="24.0" y="421.0" text-anchor="start">iCloud</text>
<text class="secondaire" x="24.0" y="436.0" text-anchor="start" style="font-size:11px">la copie iCloud de ~/Documents</text>
<text class="secondaire" x="24.0" y="450.0" text-anchor="start" style="font-size:11px">emporte très probablement tout</text>
<rect class="f-eleve" x="262.0" y="407.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-eleve gras" x="291.3" y="419.5" text-anchor="middle" style="font-size:11px">réussie</text>
<text class="secondaire" x="262.0" y="436.0" text-anchor="start" style="font-size:11px">12 fichiers en conflit « … 2 »</text>
<text class="secondaire" x="262.0" y="450.0" text-anchor="start" style="font-size:11px">hors de donnees/</text>
<rect class="f-moyen" x="485.0" y="407.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-moyen gras" x="514.3" y="419.5" text-anchor="middle" style="font-size:11px">constat</text>
<text class="secondaire" x="485.0" y="436.0" text-anchor="start" style="font-size:11px">laissé en place, par décision</text>
<rect class="carte" x="18.0" y="458.0" width="684.0" height="46.0" rx="4"/>
<text class="texte gras" x="24.0" y="477.0" text-anchor="start">Purple team (tests rejouables)</text>
<rect class="f-conforme" x="485.0" y="463.0" width="109.7" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="539.9" y="475.5" text-anchor="middle" style="font-size:11px">6 sur 6 au vert</text>
<text class="secondaire" x="485.0" y="492.0" text-anchor="start" style="font-size:11px">puis 10 tests sur 10 à l&#x27;étape 11</text>
<rect class="f-eleve" x="24.0" y="519.0" width="58.7" height="17.0" rx="8.5"/>
<text class="e-eleve gras" x="53.3" y="531.5" text-anchor="middle" style="font-size:11px">réussie</text>
<text class="secondaire petit" x="88.7" y="531.5" text-anchor="start">l&#x27;attaque passe</text>
<rect class="f-conforme" x="201.7" y="519.0" width="71.4" height="17.0" rx="8.5"/>
<text class="e-conforme gras" x="237.4" y="531.5" text-anchor="middle" style="font-size:11px">repoussée</text>
<text class="secondaire petit" x="279.1" y="531.5" text-anchor="start">elle échoue</text>
