<title id="titre">La red team, avant et après les correctifs</title>
<desc id="desc">Les six attaques de l&#x27;étape 10 : iCloud, MCP, terminal, injection, portail, ré-identification. Avant les correctifs, quatre réussissent ; après, MCP et terminal sont repoussées, injection et portail l&#x27;étaient déjà, ré-identification et iCloud restent ouvertes pour l&#x27;étape 11.</desc>
