</style>
<defs><marker id="m-neutre" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-neutre" d="M0,1 L9,5 L0,9 z"/></marker></defs>
<rect class="fond" width="720" height="582" rx="10"/>
<text class="texte titre" x="24" y="34">Les droits d&#x27;accès et d&#x27;effacement</text>
<text class="secondaire" x="24" y="55">Retrouver une personne partout, par sa signature ; répondre sans révéler les autres ; effacer, et le prouver</text>
<rect class="t-local s-local" x="24.0" y="82.0" width="672.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="360.0" y="103.2" text-anchor="middle" style="font-size:13px">La signature de la personne</text>
<text class="secondaire" x="360.0" y="120.2" text-anchor="middle" style="font-size:11.5px">ses identifiants (doublons compris), les formes de son nom, ses e-mails, ses téléphones, ses codes</text>
<rect class="t-neutre s-neutre" x="24.0" y="156.0" width="672.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="360.0" y="169.5" text-anchor="middle" style="font-size:13px">L&#x27;inventaire : une seule fonction, 22 lieux examinés</text>
<text class="secondaire" x="360.0" y="186.5" text-anchor="middle" style="font-size:11.5px">bases, index, vecteurs, fichiers, caches, journaux, sorties, journal d&#x27;Ollama, conversations de Claude Code :</text>
<text class="secondaire" x="360.0" y="202.0" text-anchor="middle" style="font-size:11.5px">trouvée dans 11</text>
<path class="s-neutre" d="M360.0,134.0 L360.0,154.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<path class="s-neutre" d="M360.0,208.0 L360.0,218.0 L187.0,218.0 L187.0,236.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<path class="s-neutre" d="M360.0,218.0 L533.0,218.0 L533.0,236.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<text class="f-controle gras" x="24.0" y="256.0" text-anchor="start">Accès · article 15</text>
<text class="f-local gras" x="370.0" y="256.0" text-anchor="start">Effacement · article 17</text>
<rect class="t-controle s-controle" x="24.0" y="268.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="187.0" y="289.2" text-anchor="middle" style="font-size:13px">Pseudonymiser les extraits</text>
<text class="secondaire" x="187.0" y="306.2" text-anchor="middle" style="font-size:11.5px">comme pour toute sortie</text>
<rect class="t-controle s-controle" x="24.0" y="330.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="187.0" y="351.2" text-anchor="middle" style="font-size:13px">Ne lever que ses codes</text>
<text class="secondaire" x="187.0" y="368.2" text-anchor="middle" style="font-size:11.5px">8 levés, 29 laissés aux autres (art. 15.4)</text>
<path class="s-neutre" d="M187.0,318.0 L187.0,328.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-controle s-controle" x="24.0" y="392.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="187.0" y="413.2" text-anchor="middle" style="font-size:13px">Réponse dans la zone privée</text>
<text class="secondaire" x="187.0" y="430.2" text-anchor="middle" style="font-size:11.5px">et un bordereau : des comptes, une empreinte</text>
<path class="s-neutre" d="M187.0,380.0 L187.0,390.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-controle s-controle" x="24.0" y="454.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="187.0" y="475.2" text-anchor="middle" style="font-size:13px">Le DPO valide</text>
<text class="secondaire" x="187.0" y="492.2" text-anchor="middle" style="font-size:11.5px">le portail refuse sans le bordereau</text>
<path class="s-neutre" d="M187.0,442.0 L187.0,452.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-local s-local" x="370.0" y="268.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="533.0" y="281.5" text-anchor="middle" style="font-size:13px">Sur une copie</text>
<text class="secondaire" x="533.0" y="298.5" text-anchor="middle" style="font-size:11.5px">les vraies bases, rouvertes avec leurs clés, puis</text>
<text class="secondaire" x="533.0" y="314.0" text-anchor="middle" style="font-size:11.5px">détruites</text>
<rect class="t-local s-local" x="370.0" y="330.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="533.0" y="343.5" text-anchor="middle" style="font-size:13px">Supprimer, caviarder</text>
<text class="secondaire" x="533.0" y="360.5" text-anchor="middle" style="font-size:11.5px">la fiche, puis « [personne effacée] » dans les</text>
<text class="secondaire" x="533.0" y="376.0" text-anchor="middle" style="font-size:11.5px">documents</text>
<path class="s-neutre" d="M533.0,318.0 L533.0,328.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-local s-local" x="370.0" y="392.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="533.0" y="405.5" text-anchor="middle" style="font-size:13px">Recalculer, écraser</text>
<text class="secondaire" x="533.0" y="422.5" text-anchor="middle" style="font-size:11.5px">les vecteurs ; secure_delete, VACUUM, index</text>
<text class="secondaire" x="533.0" y="438.0" text-anchor="middle" style="font-size:11.5px">compacté</text>
<path class="s-neutre" d="M533.0,380.0 L533.0,390.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<rect class="t-conforme s-conforme" x="370.0" y="454.0" width="326.0" height="50.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="533.0" y="475.2" text-anchor="middle" style="font-size:13px">La preuve</text>
<text class="secondaire" x="533.0" y="492.2" text-anchor="middle" style="font-size:11.5px">refaire l&#x27;inventaire : 0 dans les 22 lieux</text>
<path class="s-neutre" d="M533.0,442.0 L533.0,452.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
<text class="secondaire" x="24.0" y="530.0" text-anchor="start">Ce qui n&#x27;est pas effacé, et le dit : Claude (cloud), copie iCloud, sauvegardes ; et le journal chaîné</text>
<text class="secondaire" x="24.0" y="546.9" text-anchor="start">du portail, qui ne garde que la clé d&#x27;une fiche qui ne désigne plus personne.</text>
<text class="discret petit" x="24" y="568">Source : rapports/droits/*.json, docs/etapes/11-exercices.md · généré par outils/schemas.py</text>
</svg>
