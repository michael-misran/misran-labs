<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 582" width="720" height="582" role="img" aria-labelledby="titre desc">
<title id="titre">Les droits d&#x27;accès et d&#x27;effacement</title>
<desc id="desc">Une seule fonction d&#x27;inventaire cherche la personne dans 22 lieux, par sa signature. Pour l&#x27;accès, les extraits sont pseudonymisés puis seuls ses codes sont levés (8 levés, 29 laissés aux autres) ; un bordereau sans donnée permet au DPO de valider. Pour l&#x27;effacement, joué sur une copie, on supprime, caviarde, recalcule les vecteurs, écrase les octets, puis on refait l&#x27;inventaire : zéro partout.</desc>
