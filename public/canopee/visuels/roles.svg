<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 496" width="720" height="496" role="img" aria-labelledby="titre desc">
<title id="titre">Les rôles et leurs droits</title>
<desc id="desc">Matrice des six rôles de la zone privée : quels documents chacun voit selon leur sensibilité, qui lit les journaux, qui lit le corpus pseudonymisé, qui lève un pseudonyme et qui valide une rédaction. Tout ce qui n&#x27;est pas prévu est refusé.</desc>
