<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" width="720" height="712" role="img" aria-labelledby="titre desc">
<title id="titre">L&#x27;architecture de Canopée</title>
<desc id="desc">Claude, dans le cloud, construit le système et ne voit que le public et le pseudonymisé, par deux serveurs MCP. Sur le Mac, la zone publique et la zone privée chiffrée ; Ollama fait tourner les modèles locaux ; une donnée privée ne monte vers le cloud qu&#x27;après la passerelle et le gardien, et seulement si elle est de niveau interne. Le portail sert aux humains, en local.</desc>
