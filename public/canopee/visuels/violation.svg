<text class="texte gras" x="634.4" y="305.4" text-anchor="middle" style="font-size:13px">Notification</text>
<text class="secondaire" x="634.4" y="322.4" text-anchor="middle" style="font-size:11.5px">un projet pour le</text>
<text class="secondaire" x="634.4" y="337.9" text-anchor="middle" style="font-size:11.5px">formulaire de la</text>
<text class="secondaire" x="634.4" y="353.5" text-anchor="middle" style="font-size:11.5px">CNIL ; registre</text>
<text class="secondaire" x="634.4" y="369.0" text-anchor="middle" style="font-size:11.5px">des violations ;</text>
<text class="secondaire" x="634.4" y="384.5" text-anchor="middle" style="font-size:11.5px">information des</text>
<text class="secondaire" x="634.4" y="400.1" text-anchor="middle" style="font-size:11.5px">personnes</text>
