<text class="secondaire" x="24.0" y="442.0" text-anchor="start">Mycélium est fictif : la notification reste un exercice et rien n&#x27;est envoyé à la vraie CNIL. Ce qui</text>
<text class="secondaire" x="24.0" y="458.9" text-anchor="start">compte, c&#x27;est que la case soit remplie, par la bonne personne, avec un motif écrit.</text>
