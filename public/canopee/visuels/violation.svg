<text class="secondaire" x="497.2" y="337.9" text-anchor="middle" style="font-size:11.5px">un autre compte</text>
<text class="secondaire" x="497.2" y="353.5" text-anchor="middle" style="font-size:11.5px">que le RSSI ;</text>
<text class="secondaire" x="497.2" y="369.0" text-anchor="middle" style="font-size:11.5px">notifier ou non,</text>
<text class="secondaire" x="497.2" y="384.5" text-anchor="middle" style="font-size:11.5px">motif écrit</text>
