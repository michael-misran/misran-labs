<text class="secondaire" x="222.8" y="337.9" text-anchor="middle" style="font-size:11.5px">confidentialité,</text>
<text class="secondaire" x="222.8" y="353.5" text-anchor="middle" style="font-size:11.5px">plus de 1 000</text>
<text class="secondaire" x="222.8" y="369.0" text-anchor="middle" style="font-size:11.5px">personnes,</text>
<text class="secondaire" x="222.8" y="384.5" text-anchor="middle" style="font-size:11.5px">gravité, motif</text>
<text class="secondaire" x="222.8" y="400.1" text-anchor="middle" style="font-size:11.5px">écrit</text>
<circle class="f-local" cx="222.8" cy="268.0" r="9"/>
