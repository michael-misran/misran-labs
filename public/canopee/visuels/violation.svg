<text class="texte gras" x="24.0" y="252.0" text-anchor="start" style="font-size:13.5px">Qui fait quoi</text>
<rect class="t-neutre s-neutre" x="24.0" y="282.0" width="123.2" height="132.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="85.6" y="313.2" text-anchor="middle" style="font-size:13px">Constat</text>
<text class="secondaire" x="85.6" y="330.2" text-anchor="middle" style="font-size:11.5px">ce qui part vers</text>
<text class="secondaire" x="85.6" y="345.7" text-anchor="middle" style="font-size:11.5px">Apple, en</text>
<text class="secondaire" x="85.6" y="361.2" text-anchor="middle" style="font-size:11.5px">comptes, sans</text>
<text class="secondaire" x="85.6" y="376.8" text-anchor="middle" style="font-size:11.5px">aucune donnée</text>
<text class="secondaire" x="85.6" y="392.3" text-anchor="middle" style="font-size:11.5px">personnelle</text>
<circle class="f-neutre" cx="85.6" cy="268.0" r="9"/>
