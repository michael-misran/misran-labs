<text class="secondaire" x="360.0" y="314.7" text-anchor="middle" style="font-size:11.5px">canopee-cnil :</text>
<text class="secondaire" x="360.0" y="330.2" text-anchor="middle" style="font-size:11.5px">violation qui</text>
<text class="secondaire" x="360.0" y="345.7" text-anchor="middle" style="font-size:11.5px">continue ; risque</text>
<text class="secondaire" x="360.0" y="361.2" text-anchor="middle" style="font-size:11.5px">élevé ;</text>
<text class="secondaire" x="360.0" y="376.8" text-anchor="middle" style="font-size:11.5px">notification</text>
<text class="secondaire" x="360.0" y="392.3" text-anchor="middle" style="font-size:11.5px">obligatoire et</text>
<text class="secondaire" x="360.0" y="407.8" text-anchor="middle" style="font-size:11.5px">tardive</text>
<circle class="f-cloud" cx="360.0" cy="268.0" r="9"/>
<text class="f-fond gras" x="360.0" y="272.0" text-anchor="middle" style="font-size:11px">3</text>
<path class="s-neutre" d="M285.4,348.0 L297.4,348.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-neutre)"/>
