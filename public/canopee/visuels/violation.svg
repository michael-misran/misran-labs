<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 502" width="720" height="502" role="img" aria-labelledby="titre desc">
<title id="titre">Le déroulé d&#x27;une violation de données</title>
<desc id="desc">Frise du 22 au 30 octobre 2026 : le responsable sait le 23, les 72 heures de l&#x27;article 33 sont échues le 26, l&#x27;exercice analyse la violation le 29, Michael décide de notifier le 30, avec les motifs du retard. Puis le circuit : constat sans donnée personnelle, qualification par le RSSI, analyse par canopee-cnil, décision du DPO (un autre compte), projet de notification. Rien n&#x27;est envoyé.</desc>
