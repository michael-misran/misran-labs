<text class="texte titre" x="24" y="34">Les agents, et qui voit quoi</text>
<text class="secondaire" x="24" y="55">Un agent qui touche au privé tourne sur le Mac ; sa version cloud ne voit que le public et le pseudonymisé</text>
<rect class="t-local s-local" x="24.0" y="82.0" width="452.0" height="250.0" rx="12" stroke-width="1.25" stroke-dasharray="5 4" fill-opacity="0.55"/>
<text class="f-local gras" x="38.0" y="102.0" text-anchor="start" style="font-size:11px">SUR LE MAC</text>
<rect class="t-cloud s-cloud" x="488.0" y="82.0" width="208.0" height="250.0" rx="12" stroke-width="1.25" stroke-dasharray="5 4" fill-opacity="0.55"/>
<text class="f-cloud gras" x="502.0" y="102.0" text-anchor="start" style="font-size:11px">DANS LE CLOUD</text>
<rect class="t-local s-local" x="54.0" y="112.0" width="178.0" height="54.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="66.0" y="127.5" text-anchor="start" style="font-size:13px">Un rôle local cherche</text>
<text class="secondaire" x="66.0" y="144.5" text-anchor="start" style="font-size:11.5px">dans la base privée, selon</text>
<text class="secondaire" x="66.0" y="160.0" text-anchor="start" style="font-size:11.5px">ses droits</text>
<circle class="f-local" cx="44.0" cy="139.0" r="9"/>
<text class="f-fond gras" x="44.0" y="143.0" text-anchor="middle" style="font-size:11px">1</text>
<rect class="t-controle s-controle" x="54.0" y="180.0" width="178.0" height="54.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="66.0" y="195.5" text-anchor="start" style="font-size:13px">Pseudonymisation</text>
<text class="secondaire" x="66.0" y="212.5" text-anchor="start" style="font-size:11.5px">par la passerelle, ce qui</text>
<text class="secondaire" x="66.0" y="228.0" text-anchor="start" style="font-size:11.5px">peut sortir</text>
<circle class="f-controle" cx="44.0" cy="207.0" r="9"/>
<text class="f-fond gras" x="44.0" y="211.0" text-anchor="middle" style="font-size:11px">2</text>
<rect class="t-controle s-controle" x="54.0" y="248.0" width="178.0" height="54.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="66.0" y="263.5" text-anchor="start" style="font-size:13px">Le gardien contrôle</text>
<text class="secondaire" x="66.0" y="280.5" text-anchor="start" style="font-size:11.5px">et dépose dans la boîte</text>
<text class="secondaire" x="66.0" y="296.0" text-anchor="start" style="font-size:11.5px">d&#x27;envoi</text>
<circle class="f-controle" cx="44.0" cy="275.0" r="9"/>
<text class="f-fond gras" x="44.0" y="279.0" text-anchor="middle" style="font-size:11px">3</text>
<rect class="t-cloud s-cloud" x="518.0" y="180.0" width="162.0" height="54.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="530.0" y="195.5" text-anchor="start" style="font-size:13px">Claude lit et rédige</text>
<text class="secondaire" x="530.0" y="212.5" text-anchor="start" style="font-size:11.5px">dépose sa réponse dans</text>
<text class="secondaire" x="530.0" y="228.0" text-anchor="start" style="font-size:11.5px">la boîte</text>
<circle class="f-cloud" cx="508.0" cy="207.0" r="9"/>
<text class="f-fond gras" x="508.0" y="211.0" text-anchor="middle" style="font-size:11px">4</text>
<rect class="t-controle s-controle" x="274.0" y="248.0" width="178.0" height="54.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="286.0" y="263.5" text-anchor="start" style="font-size:13px">Ré-identification</text>
<text class="secondaire" x="286.0" y="280.5" text-anchor="start" style="font-size:11.5px">selon le rôle, puis le</text>
<text class="secondaire" x="286.0" y="296.0" text-anchor="start" style="font-size:11.5px">vérificateur relit</text>
<circle class="f-controle" cx="264.0" cy="275.0" r="9"/>
<text class="f-fond gras" x="264.0" y="279.0" text-anchor="middle" style="font-size:11px">5</text>
<rect class="t-local s-local" x="274.0" y="112.0" width="178.0" height="54.0" rx="8" stroke-width="1.25"/>
<text class="texte gras" x="286.0" y="127.5" text-anchor="start" style="font-size:13px">Un humain tranche</text>
<text class="secondaire" x="286.0" y="144.5" text-anchor="start" style="font-size:11.5px">dans le portail, le pôle</text>
<text class="secondaire" x="286.0" y="160.0" text-anchor="start" style="font-size:11.5px">programme</text>
<circle class="f-local" cx="264.0" cy="139.0" r="9"/>
<text class="f-fond gras" x="264.0" y="143.0" text-anchor="middle" style="font-size:11px">6</text>
<path class="s-controle" d="M136.0,168.0 L136.0,178.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-controle)"/>
<path class="s-controle" d="M136.0,236.0 L136.0,246.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-controle)"/>
<path class="s-controle" d="M232.0,275.0 L244.0,275.0 L244.0,316.0 L600.0,316.0 L600.0,236.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-controle)"/>
<text class="secondaire s-fond" x="482.0" y="320.0" text-anchor="middle" style="font-size:10.5px" stroke-width="4" paint-order="stroke" stroke-linejoin="round">boîte d&#x27;envoi (MCP)</text>
<path class="s-cloud" d="M516.0,207.0 L470.0,207.0 L470.0,275.0 L454.0,275.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-cloud)"/>
<path class="s-controle" d="M356.0,246.0 L356.0,168.0" fill="none" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#m-controle)"/>
<text class="texte gras" x="24.0" y="368.0" text-anchor="start" style="font-size:13.5px">Les sept agents</text>
<text class="secondaire petit gras" x="24.0" y="392.0" text-anchor="start">Agent</text>
<text class="secondaire petit gras" x="170.0" y="392.0" text-anchor="start">Sur le Mac</text>
<text class="secondaire petit gras" x="450.0" y="392.0" text-anchor="start">Dans le cloud (Claude)</text>
<rect class="carte" x="18.0" y="401.0" width="684.0" height="26.0" rx="4"/>
<text class="texte gras" x="24.0" y="418.0" text-anchor="start">Gardien</text>
<text class="secondaire" x="170.0" y="418.0" text-anchor="start">règle codée : toute sortie passe par lui</text>
<text class="discret" x="450.0" y="418.0" text-anchor="start">pas de version cloud</text>
<text class="texte gras" x="24.0" y="444.0" text-anchor="start">Analyste</text>
<text class="secondaire" x="170.0" y="444.0" text-anchor="start">Gemma : affirmations et niveau de preuve</text>
<text class="secondaire" x="450.0" y="444.0" text-anchor="start">le public seulement</text>
<rect class="carte" x="18.0" y="453.0" width="684.0" height="26.0" rx="4"/>
<text class="texte gras" x="24.0" y="470.0" text-anchor="start">Vérificateur</text>
<text class="secondaire" x="170.0" y="470.0" text-anchor="start">Qwen : relit phrase par phrase</text>
<text class="secondaire" x="450.0" y="470.0" text-anchor="start">le public et le pseudonymisé</text>
<text class="texte gras" x="24.0" y="496.0" text-anchor="start">Rédacteur</text>
<text class="secondaire" x="170.0" y="496.0" text-anchor="start">Gemma : rédige, puis fait vérifier</text>
<text class="secondaire" x="450.0" y="496.0" text-anchor="start">le public, ou un brief pseudonymisé</text>
<rect class="carte" x="18.0" y="505.0" width="684.0" height="26.0" rx="4"/>
<text class="texte gras" x="24.0" y="522.0" text-anchor="start">Veilleur</text>
<text class="secondaire" x="170.0" y="522.0" text-anchor="start">sans modèle : la liste blanche entre seule</text>
<text class="discret" x="450.0" y="522.0" text-anchor="start">pas de version cloud</text>
<text class="texte gras" x="24.0" y="548.0" text-anchor="start">CNIL</text>
<text class="secondaire" x="170.0" y="548.0" text-anchor="start">commande locale qui compte</text>
<text class="secondaire" x="450.0" y="548.0" text-anchor="start">rédige l&#x27;audit, sans terminal</text>
<rect class="carte" x="18.0" y="557.0" width="684.0" height="26.0" rx="4"/>
<text class="texte gras" x="24.0" y="574.0" text-anchor="start">Hacker</text>
<text class="secondaire" x="170.0" y="574.0" text-anchor="start">Qwen : mène les attaques, des comptes</text>
<text class="secondaire" x="450.0" y="574.0" text-anchor="start">raisonne sur la surface, sans terminal</text>
