<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 624" width="720" height="624" role="img" aria-labelledby="titre desc">
<title id="titre">Les agents, et qui voit quoi</title>
<desc id="desc">En haut, le seul chemin d&#x27;une donnée privée vers Claude, en six temps : un rôle local cherche, la passerelle pseudonymise, le gardien contrôle et dépose dans la boîte d&#x27;envoi, Claude rédige, la réponse est ré-identifiée et vérifiée sur le Mac, un humain tranche. En bas, les sept agents, leur version locale et leur version cloud.</desc>
