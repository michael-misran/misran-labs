<!doctype html>
<html lang="fr" data-theme="papier">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Soon Pro</title>
    <link rel="stylesheet" href="p007.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-toolbar">
        <a class="back-link" href="liste.html">← Liste</a>
        <h1>Soon Pro</h1>
        <span></span>
      </div>

      <div class="phone">
        <div class="dynamic-island"></div>
        <div class="phone-screen">
          <div class="status-bar" data-status-bar></div>
          <div class="screen-content">
            <div class="pro-hero">
              <div class="badge">Soon Pro</div>
              <h2>Débloquez tout Soon</h2>
              <div class="pro-price">1,99 € <small>· achat unique, pas d'abonnement</small></div>

            <ul class="pro-features">
              <li><span class="check">✓</span> Événements illimités</li>

              <li><span class="check">✓</span> Photo personnelle en fond de widget</li>
            </ul>

            <button class="btn primary" type="button" style="width:100%;" onclick="alert('Achat factice — maquette uniquement.')">
              Débloquer Soon Pro — 1,99 €
            </button>
            <a class="pro-restore" href="#" onclick="alert('Restauration factice — maquette uniquement.'); return false;">Restaurer mes achats</a>
          </div>
        </div>
      </div>
    </div>

    <script src="p007.js" defer></script>
