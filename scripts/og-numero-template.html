<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Oswald:wght@500;700&display=swap"
  rel="stylesheet"
/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #f6f1e6;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 28px;
    border: 3px double #16120e;
  }
  .bandeau {
    position: absolute;
    top: 28px;
    bottom: 28px;
    left: 28px;
    width: 14px;
    background: #2b3a9b;
  }
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px 0 110px;
  }
  .eyebrow {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #2b3a9b;
    margin-bottom: 22px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 900;
    font-size: {{TAILLE_TITRE}}px;
    line-height: 1.05;
    color: #16120e;
    letter-spacing: -0.01em;
    max-width: 760px;
  }
  .subtitle {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 16px;
    letter-spacing: 0.02em;
    color: #4b443c;
    margin-top: 26px;
  }
  .tampon { position: absolute; top: 70px; right: 90px; width: 128px; height: 128px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="bandeau"></div>
  <svg class="tampon" viewBox="0 0 100 100" aria-hidden="true">
    <defs><path id="cercle" d="M50 50 m-34.5 0 a34.5 34.5 0 1 1 69 0 a34.5 34.5 0 1 1 -69 0"/></defs>
    <circle cx="50" cy="50" r="47" fill="none" stroke="#2b3a9b" stroke-width="2"/>
    <circle cx="50" cy="50" r="29" fill="none" stroke="#2b3a9b" stroke-width="1"/>
    <text font-family="Oswald" font-size="10.4" font-weight="700" fill="#2b3a9b"><textPath href="#cercle" textLength="216" lengthAdjust="spacing">MISRAN · LABS · </textPath></text>
    <text x="50" y="57" text-anchor="middle" font-family="Playfair Display" font-style="italic" font-weight="900" font-size="22" fill="#2b3a9b">M</text>
  </svg>
  <div class="content">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITRE}}</h1>
    <div class="subtitle">Misran Labs — veille IA hebdomadaire</div>
  </div>
</body>
</html>
